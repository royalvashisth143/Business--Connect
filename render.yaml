# Render Deployment Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  # Option 1: High-Performance Static Site (Recommended for Vite React SPA)
  - type: web
    name: business-connect-india
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # Option 2: Node.js Web Service (If deploying with server runtime)
